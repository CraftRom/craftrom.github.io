output: web
# this property is useful for conditional filtering of content that is separate from the PDF.

title: CraftRom
# this appears in the html browser tab for the site title (seen mostly by search engines, not users)

company_name: CraftRom Project
# this appears in the footer

description: "CraftRom OS - a custom ROM based on AOSP with Google apps, offering top-notch stability and functionality for your device"
# the description is used in the feed.xml file

# needed for sitemap.xml file only
url: https://craft-rom.pp.ua/

github: [metadata]

host: 127.0.0.1
# the preview server used. Leave as is.

port: 4000
# the port where the preview is rendered. You can leave this as is unless you have other Jekyll builds using this same port that might cause conflicts. in that case, use another port such as 4006.

# Includes an icon in the footer for each username you enter
footer-links:
  email:
  facebook: CRAFT-ROM-112316070620530
  telegram: craftrom
  telegram_news: craftrom_news
  github: CraftRom
  rss: true
  twitter:

languages: ["en", "ua"]
default_lang: "en"
exclude_from_localization: ["assets/css", "assets/img"]
parallel_localization: true

exclude:
  - .idea/
  - .gitignore
  - device_sample/
  - Dockerfile
  - Dockerfile.deploy
  - Gemfile
  - Gemfile.lock
  - licenses/
  - scripts/
  - test/
  - vendor/

# these are the files and directories that jekyll will exclude from the build

highlighter: rouge
# library used for syntax highlighting

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

# filter used to process markdown. note that kramdown differs from github-flavored markdown in some subtle ways

collections:
  tooltips:
    output: true
# collections are declared here. this renders the content in _tooltips and processes it, but doesn't output it as actual files in the output unless you change output to true

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      search: true

# these are defaults used for the frontmatter for these file types

# Set the Sass partials directory, as we're using @imports
sass:
  style: :compressed # You might prefer to minify using :compressed
  sourcemap: always
# Use the following plug-ins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-polyglot
